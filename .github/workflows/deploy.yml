name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Continuous Integration: lint every push & PR ───────────────
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, curl, json, pdo, pdo_mysql
          tools: composer

      - name: Validate composer.json / composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies (verifies the lock resolves)
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: PHP syntax check (all .php files)
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l >/dev/null
          echo "All PHP files parsed OK."

  # ── Continuous Deployment: only on push to main, after lint ────
  deploy:
    name: Deploy to production
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy files via rsync
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude-from=.deployignore \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Install dependencies on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             /opt/cpanel/ea-php83/root/usr/bin/php -d allow_url_fopen=On \
               composer.phar install --no-dev --optimize-autoloader --no-interaction"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
